[project]
name = "mindsight"
version = "0.1.0"
description = "AI-Powered Mental Health Risk Detection Through Conversational Analytics"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "bandit>=1.7.7",
    "datasets>=2.16.0",
    "dvc>=3.42.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.7.0",
    "mlflow>=2.10.0",
    "nltk>=3.8.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "ruff>=0.2.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "shap>=0.44.0",
    "spacy>=3.7.0",
    "streamlit>=1.31.0",
    "tokenizers>=0.15.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "uvicorn[standard]>=0.27.0",
    "vadersentiment>=3.3.2",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
